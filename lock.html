<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Profile Locked</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <form class="card" id="form" autocomplete="off">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </div>
      <h1>Profile locked</h1>
      <p class="sub">Enter your password to continue.<br>Your tabs will be restored.</p>
      <label for="pw">Password</label>
      <input type="password" id="pw" autofocus spellcheck="false">
      <button type="submit" id="btn">Unlock</button>
      <div class="msg" id="msg"></div>
      <div class="meta">
        <span>PBKDF2-SHA256</span>
        <span class="status" id="status">LOCKED</span>
      </div>
    </form>
    <div class="below">Press <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>L</kbd> to lock anytime</div>
  </div>
  <script src="lock.js"></script>
</body>
</html>
