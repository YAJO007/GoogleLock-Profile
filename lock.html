<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>🔒 โปรไฟล์ถูกล็อก</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <form class="card" id="form" autocomplete="off">
      <div class="icon">🔒</div>
      <h1>โปรไฟล์นี้ถูกล็อก</h1>
      <p class="sub">ใส่รหัสผ่านเพื่อปลดล็อก แท็บทั้งหมดจะกลับมาเหมือนเดิม</p>
      <label for="pw">รหัสผ่าน</label>
      <input type="password" id="pw" autofocus>
      <button type="submit" id="btn">ปลดล็อก</button>
      <div class="msg error" id="msg"></div>
    </form>
  </div>
  <script src="lock.js"></script>
</body>
</html>
